<meta name="description" content="Several quotes from the text: (Luke X, 22-24) 
Luke X, 22 — &amp;#39;ὑπὸ τοῦ πατρός&amp;#39; — &amp;#39;hypo tou patros&amp;#39; — by the Father. Here the preposition &amp;#39;hypo&amp;#39; with the genitive case indicates the passive voice of the participle delivered. It carries two meanings here: transmission irrespective of the Incarnation, and transmission regarding the human nature of the already Incarnate Son of God. In His Divinity, the Son of God receives all from the Father, of Whom He is begotten eternally; according to His human nature, He also receives all from the Father. The Incarnate Son of God as man possesses all God&amp;#39;s gifts intended by God for humanity — in particular, He is King, Prophet, High Priest, Christ, Saviour, Deliverer, Conqueror, and more. It must also be understood that some of these divine gifts were not originally what God willed the Son of God to have when creating the world and humanity; for instance, God did not will that humans should sin when creating them, yet as All-Knowing He knew that they would sin. Thus He sent the Son to save them; hence, as man, the Son of God became the Saviour and Deliverer Who suffered for us and the like,
